          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
        - access
        - password
        - refresh
        - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
        - access
        - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description:
            Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        role:
          allOf:
            - $ref: "#/components/schemas/UserRoleEnum"
          readOnly: true
        phone:
          type: string
          maxLength: 20
        branch:
          allOf:
            - $ref: "#/components/schemas/Branch"
          readOnly: true
      required:
        - branch
        - id
        - role
        - username
    UserRoleEnum:
      enum:
        - admin
        - technician
        - manager
      type: string
      description: |-
        * `admin` - Admin
        * `technician` - Technician
        * `manager` - Manager
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
