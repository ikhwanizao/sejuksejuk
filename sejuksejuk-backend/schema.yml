openapi: 3.0.3
info:
  title: Sejuk Sejuk Operations API
  version: 1.0.0
  description: Internal operations system for air-conditioner service management.
paths:
  /api/ai/conversations/{id}/:
    get:
      operationId: ai_conversations_retrieve
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
      tags:
        - ai
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
          description: ""
  /api/ai/query/:
    post:
      operationId: ai_query_create
      tags:
        - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Query"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Query"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Query"
        required: true
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIQueryResponse"
          description: ""
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenObtainPair"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenObtainPair"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TokenObtainPair"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenObtainPair"
          description: ""
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
        - auth
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: ""
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefresh"
          description: ""
  /api/kpi/leaderboard/:
    get:
      operationId: kpi_leaderboard_retrieve
      parameters:
        - in: query
          name: end
          schema:
            type: string
          description: ISO date YYYY-MM-DD
        - in: query
          name: metric
          schema:
            type: string
          description: jobs | amount
        - in: query
          name: period
          schema:
            type: string
          description: week | month | today
        - in: query
          name: start
          schema:
            type: string
          description: ISO date YYYY-MM-DD
      tags:
        - kpi
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardRow"
          description: ""
  /api/kpi/summary/:
    get:
      operationId: kpi_summary_retrieve
      parameters:
        - in: query
          name: end
          schema:
            type: string
          description: ISO date YYYY-MM-DD
        - in: query
          name: period
          schema:
            type: string
          description: week | month | today
        - in: query
          name: start
          schema:
            type: string
          description: ISO date YYYY-MM-DD
      tags:
        - kpi
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KPISummary"
          description: ""
  /api/kpi/technicians/:
    get:
      operationId: kpi_technicians_retrieve
      parameters:
        - in: query
          name: end
          schema:
            type: string
          description: ISO date YYYY-MM-DD
        - in: query
          name: period
          schema:
            type: string
          description: week | month | today
        - in: query
          name: start
          schema:
            type: string
          description: ISO date YYYY-MM-DD
      tags:
        - kpi
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KPIRow"
          description: ""
  /api/orders/:
    get:
      operationId: orders_list
      parameters:
        - in: query
          name: assigned_technician
          schema:
            type: integer
        - in: query
          name: created_after
          schema:
            type: string
            format: date-time
        - in: query
          name: created_before
          schema:
            type: string
            format: date-time
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
        - in: query
          name: service_type
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum:
              - assigned
              - closed
              - in_progress
              - job_done
              - new
              - reviewed
          description: |-
            * `new` - New
            * `assigned` - Assigned
            * `in_progress` - In Progress
            * `job_done` - Job Done
            * `reviewed` - Reviewed
            * `closed` - Closed
      tags:
        - orders
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrderListList"
          description: ""
    post:
      operationId: orders_create
      tags:
        - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OrderCreate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/OrderCreate"
        required: true
      security:
        - jwtAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreate"
          description: ""
  /api/orders/{order_pk}/notifications/:
    get:
      operationId: orders_notifications_list
      parameters:
        - in: path
          name: order_pk
          schema:
            type: integer
          required: true
      tags:
        - orders
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
          description: ""
  /api/orders/{order_pk}/report/:
    get:
      operationId: orders_report_retrieve
      parameters:
        - in: path
          name: order_pk
          schema:
            type: integer
          required: true
      tags:
        - orders
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceReport"
          description: ""
  /api/orders/{id}/:
    get:
      operationId: orders_retrieve
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this order.
          required: true
      tags:
        - orders
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
          description: ""
    put:
      operationId: orders_update
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this order.
          required: true
      tags:
        - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
        required: true
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderUpdate"
          description: ""
    patch:
      operationId: orders_partial_update
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this order.
          required: true
      tags:
        - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchedOrderUpdate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PatchedOrderUpdate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PatchedOrderUpdate"
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderUpdate"
          description: ""
    delete:
      operationId: orders_destroy
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this order.
          required: true
      tags:
        - orders
      security:
        - jwtAuth: []
      responses:
        "204":
          description: No response body
  /api/orders/{id}/assign/:
    post:
      operationId: orders_assign_create
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this order.
          required: true
      tags:
        - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderDetail"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OrderDetail"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/OrderDetail"
        required: true
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
          description: ""
  /api/orders/{id}/close/:
    post:
      operationId: orders_close_create
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this order.
          required: true
      tags:
        - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderDetail"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OrderDetail"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/OrderDetail"
        required: true
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
          description: ""
  /api/orders/{id}/complete/:
    post:
      operationId: orders_complete_create
      description:
        Handled by services app; this action delegates to ServiceReport
        creation.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this order.
          required: true
      tags:
        - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderDetail"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OrderDetail"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/OrderDetail"
        required: true
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
          description: ""
  /api/orders/{id}/review/:
    post:
      operationId: orders_review_create
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this order.
          required: true
      tags:
        - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderDetail"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OrderDetail"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/OrderDetail"
        required: true
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
          description: ""
  /api/orders/{id}/start/:
    post:
      operationId: orders_start_create
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this order.
          required: true
      tags:
        - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderDetail"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OrderDetail"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/OrderDetail"
        required: true
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
          description: ""
  /api/reports/{report_pk}/attachments/:
    get:
      operationId: reports_attachments_list
      parameters:
        - in: path
          name: report_pk
          schema:
            type: integer
          required: true
      tags:
        - reports
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceAttachment"
          description: ""
    post:
      operationId: reports_attachments_create
      parameters:
        - in: path
          name: report_pk
          schema:
            type: integer
          required: true
      tags:
        - reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceAttachmentCreate"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/ServiceAttachmentCreate"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ServiceAttachmentCreate"
        required: true
      security:
        - jwtAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAttachment"
          description: ""
  /api/reports/{report_pk}/attachments/{att_pk}/:
    delete:
      operationId: reports_attachments_destroy
      parameters:
        - in: path
          name: att_pk
          schema:
            type: integer
          required: true
        - in: path
          name: report_pk
          schema:
            type: integer
          required: true
      tags:
        - reports
      security:
        - jwtAuth: []
      responses:
        "204":
          description: No response body
  /api/reports/{report_pk}/payment/:
    post:
      operationId: reports_payment_create
      parameters:
        - in: path
          name: report_pk
          schema:
            type: integer
          required: true
      tags:
        - reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Payment"
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/Payment"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Payment"
        required: true
      security:
        - jwtAuth: []
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
          description: ""
  /api/service-types/:
    get:
      operationId: service_types_list
      parameters:
        - name: ordering
          required: false
          in: query
          description: Which field to use when ordering the results.
          schema:
            type: string
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: search
          required: false
          in: query
          description: A search term.
          schema:
            type: string
      tags:
        - service-types
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedServiceTypeList"
          description: ""
  /api/service-types/{id}/:
    get:
      operationId: service_types_retrieve
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this service type.
          required: true
      tags:
        - service-types
      security:
        - jwtAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceType"
          description: ""
components:
  schemas:
    AIQueryResponse:
      type: object
      properties:
        conversation_id:
          type: integer
        answer:
          type: string
        sources:
          type: array
          items: {}
      required:
        - answer
        - conversation_id
        - sources
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 20
        address:
          type: string
      required:
        - code
        - id
        - name
    ChannelEnum:
      enum:
        - whatsapp
      type: string
      description: "* `whatsapp` - WhatsApp"
    ConversationDetail:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required:
        - created_at
        - id
        - messages
    EventTypeEnum:
      enum:
        - status_change
        - rescheduled
        - note
      type: string
      description: |-
        * `status_change` - Status Change
        * `rescheduled` - Rescheduled
        * `note` - Note
    KPIRow:
      type: object
      properties:
        technician_id:
          type: integer
        technician_name:
          type: string
        jobs_completed:
          type: integer
        total_amount:
          type: number
          format: double
        reschedule_count:
          type: integer
      required:
        - jobs_completed
        - reschedule_count
        - technician_id
        - technician_name
        - total_amount
    KPISummary:
      type: object
      properties:
        period:
          type: string
        start:
          type: string
        end:
          type: string
        total_jobs:
          type: integer
        total_amount:
          type: number
          format: double
      required:
        - end
        - period
        - start
        - total_amount
        - total_jobs
    KindEnum:
      enum:
        - photo
        - video
        - pdf
      type: string
      description: |-
        * `photo` - Photo
        * `video` - Video
        * `pdf` - PDF
    LeaderboardRow:
      type: object
      properties:
        rank:
          type: integer
        technician_id:
          type: integer
        technician_name:
          type: string
        jobs_completed:
          type: integer
        total_amount:
          type: number
          format: double
        reschedule_count:
          type: integer
      required:
        - jobs_completed
        - rank
        - reschedule_count
        - technician_id
        - technician_name
        - total_amount
    Message:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          $ref: "#/components/schemas/MessageRoleEnum"
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - content
        - created_at
        - id
        - role
    MessageRoleEnum:
      enum:
        - user
        - assistant
        - tool
      type: string
      description: |-
        * `user` - User
        * `assistant` - Assistant
        * `tool` - Tool
    MethodEnum:
      enum:
        - cash
        - transfer
        - card
        - ewallet
      type: string
      description: |-
        * `cash` - Cash
        * `transfer` - Bank Transfer
        * `card` - Card
        * `ewallet` - E-Wallet
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        channel:
          $ref: "#/components/schemas/ChannelEnum"
        recipient_type:
          $ref: "#/components/schemas/RecipientTypeEnum"
        recipient_phone:
          type: string
          maxLength: 20
        message:
          type: string
        deep_link_url:
          type: string
        notification_status:
          $ref: "#/components/schemas/NotificationStatusEnum"
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
        - created_at
        - deep_link_url
        - id
        - message
        - recipient_phone
        - recipient_type
    NotificationStatusEnum:
      enum:
        - generated
        - sent
      type: string
      description: |-
        * `generated` - Generated
        * `sent` - Sent
    OrderCreate:
      type: object
      properties:
        customer_name:
          type: string
          maxLength: 150
        customer_phone:
          type: string
          maxLength: 20
        customer_address:
          type: string
        problem_description:
          type: string
        service_type_id:
          type: integer
          nullable: true
        quoted_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        admin_notes:
          type: string
      required:
        - customer_address
        - customer_name
        - customer_phone
        - problem_description
    OrderDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order_no:
          type: string
          readOnly: true
        customer_name:
          type: string
          maxLength: 150
        customer_phone:
          type: string
          maxLength: 20
        customer_address:
          type: string
        problem_description:
          type: string
        service_type:
          allOf:
            - $ref: "#/components/schemas/ServiceType"
          readOnly: true
        quoted_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        admin_notes:
          type: string
        status:
          $ref: "#/components/schemas/StatusEnum"
        assigned_technician:
          allOf:
            - $ref: "#/components/schemas/User"
          readOnly: true
        created_by:
          allOf:
            - $ref: "#/components/schemas/User"
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/OrderEvent"
          readOnly: true
      required:
        - assigned_technician
        - created_at
        - created_by
        - customer_address
        - customer_name
        - customer_phone
        - events
        - id
        - order_no
        - problem_description
        - service_type
        - updated_at
    OrderEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        event_type:
          $ref: "#/components/schemas/EventTypeEnum"
        from_status:
          type: string
          maxLength: 20
        to_status:
          type: string
          maxLength: 20
        actor:
          allOf:
            - $ref: "#/components/schemas/User"
          readOnly: true
        note:
          type: string
        at:
