          type: string
          maxLength: 20
        customer_address:
          type: string
        problem_description:
          type: string
        service_type_id:
          type: integer
          nullable: true
        quoted_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
